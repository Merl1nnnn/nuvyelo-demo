name: Publish Nuvyelo demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify and unpack the static build
        run: |
          echo '979cc02b767a37a5e4fa804e8e7334245c55161f10ce80e3e47e2f8120c7ce3e  nuvyelo-site.zip' | sha256sum --check --strict
          echo '174e2c668544b6d2f35e1cc20fb81b2e06739c13b776e204e45ffb6a8652fffa  nuvyelo-desktop.zip' | sha256sum --check --strict
          unzip -q nuvyelo-site.zip -d _site
          unzip -q nuvyelo-desktop.zip -d _site
          test -f _site/index.html
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _site
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
